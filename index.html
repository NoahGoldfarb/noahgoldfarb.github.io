<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <link rel="manifest" href="manifest.json">
    <title>Workout Plan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        .offline-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }

        .offline-indicator.show {
            display: block;
        }

        .offline-indicator.online {
            background: #27ae60;
        }

        .sync-indicator {
            position: fixed;
            top: 50px;
            right: 10px;
            background: #f39c12;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            z-index: 1000;
            display: none;
        }

        .sync-indicator.show {
            display: block;
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            font-size: 2rem;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        h3 {
            color: #555;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .hidden {
            display: none;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button.secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        button.danger {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
        }

        button.success {
            background: linear-gradient(135deg, #27ae60 0%, #229954 100%);
        }

        button.small {
            width: auto;
            padding: 8px 16px;
            font-size: 14px;
            display: inline-block;
            margin: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 5px;
            background: #f8f9fa;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            background: white;
        }

        .day-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .day-btn {
            padding: 15px;
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s;
        }

        .day-btn:hover {
            border-color: #667eea;
            background: white;
        }

        .day-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .exercise-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .exercise-card.current {
            border-left: 4px solid #27ae60;
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
        }

        .exercise-card.completed {
            opacity: 0.6;
            border-left: 4px solid #95a5a6;
        }

        .exercise-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 8px;
        }

        .exercise-name a {
            color: #667eea;
            text-decoration: none;
        }

        .exercise-name a:hover {
            text-decoration: underline;
        }

        .exercise-details {
            color: #555;
            font-size: 1rem;
        }

        .timer {
            font-size: 4rem;
            font-weight: bold;
            text-align: center;
            color: #667eea;
            margin: 30px 0;
        }

        .timer.warning {
            color: #f39c12;
        }

        .timer.danger {
            color: #e74c3c;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .log-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        .label {
            display: block;
            color: #555;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .error {
            color: #e74c3c;
            padding: 12px;
            background: #fee;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .success-msg {
            color: #27ae60;
            padding: 12px;
            background: #efe;
            border-radius: 10px;
            text-align: center;
            margin-top: 10px;
        }

        .workout-summary {
            text-align: center;
            padding: 20px;
        }

        .summary-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .heatmap-container {
            margin: 20px 0;
            overflow-x: auto;
        }

        .heatmap {
            display: inline-grid;
            grid-template-rows: repeat(7, 1fr);
            grid-auto-flow: column;
            gap: 3px;
            margin-top: 10px;
        }

        .heatmap-cell {
            width: 12px;
            height: 12px;
            background: #ebedf0;
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .heatmap-cell[data-level="1"] { background: #c6e48b; }
        .heatmap-cell[data-level="2"] { background: #7bc96f; }
        .heatmap-cell[data-level="3"] { background: #239a3b; }
        .heatmap-cell[data-level="4"] { background: #196127; }

        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        .heatmap-legend-item {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

.month-labels {
    margin-bottom: 5px;
    font-size: 12px;
    color: #666;
}

        .edit-day-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .edit-exercise-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e0e0e0;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .stat-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin: 20px 0;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .timer {
                font-size: 3rem;
            }

            .input-grid {
                grid-template-columns: 1fr;
            }

            .heatmap-cell {
                width: 10px;
                height: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Offline/Online Indicator -->
    <div id="offlineIndicator" class="offline-indicator">📡 Offline</div>
    <div id="syncIndicator" class="sync-indicator">🔄 Synchronisiere...</div>

    <div class="container">
        <!-- Login Screen -->
        <div id="authScreen" class="card">
            <h1>🏋️ Workout Plan</h1>
            <label class="label" for="password">Passwort</label>
            <input type="password" id="password" placeholder="Passwort eingeben" onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">Anmelden</button>
            <div id="authError" class="error hidden"></div>
        </div>
        <button onclick="addTestWorkout()">Test - Add Workout for Today</button>

        <div id="dayScreen" class="hidden card">
            <h1>🏋️ Workout Plan</h1>
            
            <div class="stat-row">
                <div class="stat-item">
                    <div class="stat-value" id="totalDays">0</div>
                    <div class="stat-label">Tage trainiert</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="currentStreak">0</div>
                    <div class="stat-label">Aktuelle Serie</div>

                <div class="stat-item">
                    <div class="stat-value" id="longestStreak">0</div>

            <div class="heatmap-container">
                <div class="month-labels" id="monthLabels"></div>
                <div class="heatmap" id="heatmap"></div>
                <div class="heatmap-legend">
                    <span>Weniger</span>
                    <div class="heatmap-legend-item" style="background: #ebedf0;"></div>
                    <div class="heatmap-legend-item" style="background: #c6e48b;"></div>

                    <div class="heatmap-legend-item" style="background: #196127;"></div>

            <h2>Wähle deinen Trainingstag</h2>
            <div class="day-selector" id="daySelector"></div>
            <button onclick="showEditPlan()" class="secondary">✏️ Plan bearbeiten</button>
        </div>

        <!-- Workout Screen -->
        <div id="workoutScreen" class="hidden">
            <div class="card">
                <h1 id="workoutTitle">Upper A - Strength</h1>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div id="exerciseList"></div>
            </div>

            <div id="restTimer" class="hidden card">
                <h2 style="text-align: center; color: #555;">Pause</h2>
                <div class="timer" id="timerDisplay">2:00</div>
                <button onclick="skipRest()">⏭️ Pause überspringen</button>
                <button onclick="endWorkout()" class="danger">❌ Workout beenden</button>
            </div>

            <div id="exerciseCard" class="hidden card">
                <h2 id="currentExerciseName">Übung</h2>
                <div class="exercise-details" id="currentExerciseDetails"></div>
                
                <div class="log-inputs">
                    <div>
                        <label class="label" for="logWeight">Gewicht (kg)</label>
                        <input type="number" id="logWeight" step="0.5" placeholder="Optional">
                    </div>
                    <div>
                        <label class="label" for="logReps">Wiederholungen</label>
                        <input type="number" id="logReps" placeholder="Optional">
                    </div>
                </div>

                <button onclick="nextExercise()" class="success">✓ Fertig & Weiter</button>
                <button onclick="skipExercise()" class="secondary">⏭️ Überspringen</button>
                <button onclick="endWorkout()" class="danger">❌ Workout beenden</button>
            </div>

            <div id="completeCard" class="hidden card">
                <div class="workout-summary">
                    <div class="summary-icon">🎉</div>
                    <h2>Workout abgeschlossen!</h2>
                    <p style="color: #555; margin-top: 10px;">Großartige Arbeit!</p>
                </div>
                <button onclick="backToDaySelection()">🏠 Zurück zur Auswahl</button>
            </div>
        </div>

        <!-- Edit Plan Screen -->
        <div id="editScreen" class="hidden card">
            <h1>✏️ Plan bearbeiten</h1>
            <div id="editContent"></div>
            <button onclick="savePlanEdits()">💾 Speichern</button>
            <button onclick="backToDaySelection()" class="secondary">⬅️ Zurück ohne Speichern</button>
            <div id="editError" class="error hidden"></div>
            <div id="editSuccess" class="success-msg hidden"></div>
        </div>
    </div>

                "Sonntag": {"name": "Lower B - Hypertrophie", "workout_type": "lower", "exercises": [{"name": "Front Kniebeuge", "sets": 4, "reps": "6-10"}, {"name": "Beinbeuger liegend", "sets": 4, "reps": "10-15"}, {"name": "Hip Thrust", "sets": 3, "reps": "8-12"}, {"name": "Ausfallschritte", "sets": 3, "reps": "12-16 Schritte"}, {"name": "Wadenheben sitzend", "sets": 4, "reps": "12-20"}, {"name": "Kabel Crunches", "sets": 3, "reps": "12-15"}]}
            }
        };

        let currentDay = null;
        let currentExerciseIndex = 0;
        let completedExercises = [];
        let timerInterval = null;
        let remainingSeconds = 120;
        let workoutData = {};
        let isOnline = navigator.onLine;
        let pendingSync = [];

        const exerciseLinks = {
            "Schrägbankdrücken Langhantel": "https://www.youtube.com/results?search_query=incline+barbell+bench+press+tutorial",
            "Gewichtete Klimmzüge": "https://www.youtube.com/results?search_query=weighted+pull+ups+tutorial",
            "T-Bar Rudern": "https://www.youtube.com/results?search_query=t+bar+row+tutorial",
            "Kabel Seitheben": "https://www.youtube.com/results?search_query=cable+lateral+raise+tutorial",
            "Überkopf Trizeps Kabel": "https://www.youtube.com/results?search_query=overhead+cable+triceps+extension+tutorial",
            "Bizeps Curl Kabel": "https://www.youtube.com/results?search_query=cable+curl+tutorial",
            "Kniebeuge": "https://www.youtube.com/results?search_query=back+squat+tutorial",
            "Rumänisches Kreuzheben": "https://www.youtube.com/results?search_query=romanian+deadlift+tutorial",
            "Beinpresse": "https://www.youtube.com/results?search_query=leg+press+tutorial",
            "Wadenheben stehend": "https://www.youtube.com/results?search_query=standing+calf+raise+tutorial",
            "Beinheben hängend": "https://www.youtube.com/results?search_query=hanging+leg+raise+tutorial",
            "Kurzhantel Bankdrücken": "https://www.youtube.com/results?search_query=dumbbell+bench+press+tutorial",
            "Kabel Flys": "https://www.youtube.com/results?search_query=cable+fly+tutorial",
            "Klimmzüge oder Latzug": "https://www.youtube.com/results?search_query=pull+ups+lat+pulldown+tutorial",
            "Rudern Kabel sitzend": "https://www.youtube.com/results?search_query=seated+cable+row+tutorial",
            "Kurzhantel Seitheben": "https://www.youtube.com/results?search_query=dumbbell+lateral+raise+tutorial",
            "Reverse Flys Kabel": "https://www.youtube.com/results?search_query=cable+reverse+fly+tutorial",
            "Bizeps Curl EZ-Stange": "https://www.youtube.com/results?search_query=ez+bar+curl+tutorial",
            "Trizeps Pushdown": "https://www.youtube.com/results?search_query=triceps+pushdown+tutorial",
            "Front Kniebeuge": "https://www.youtube.com/results?search_query=front+squat+tutorial",
            "Beinbeuger liegend": "https://www.youtube.com/results?search_query=lying+leg+curl+tutorial",
            "Hip Thrust": "https://www.youtube.com/results?search_query=hip+thrust+tutorial",
            "Ausfallschritte": "https://www.youtube.com/results?search_query=walking+lunges+tutorial",
            "Wadenheben sitzend": "https://www.youtube.com/results?search_query=seated+calf+raise+tutorial",
            "Kabel Crunches": "https://www.youtube.com/results?search_query=cable+crunch+tutorial"
        };

        // Load saved plan
        const savedPlan = localStorage.getItem('workoutPlan');
        if (savedPlan) {
            try {
                workoutPlan = JSON.parse(savedPlan);
            } catch (e) {
                console.error('Error loading saved plan:', e);
            }
        }

        // Load pending sync data
        const savedPendingSync = localStorage.getItem('pendingSync');
        if (savedPendingSync) {
            try {
                pendingSync = JSON.parse(savedPendingSync);
            } catch (e) {
                console.error('Error loading pending sync:', e);
            }
        }

        // Online/Offline detection
        function updateOnlineStatus() {
            isOnline = navigator.onLine;
            const indicator = document.getElementById('offlineIndicator');
            
            if (isOnline) {
                indicator.textContent = '📡 Online';
                indicator.classList.add('online');
                indicator.classList.add('show');
                setTimeout(() => indicator.classList.remove('show'), 3000);
                
                // Try to sync pending data
                syncPendingData();
            } else {
                indicator.textContent = '📡 Offline';
                indicator.classList.remove('online');
                indicator.classList.add('show');
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // Sync pending data to Firebase
        async function syncPendingData() {
            if (pendingSync.length === 0) return;
            
            const syncIndicator = document.getElementById('syncIndicator');
            syncIndicator.classList.add('show');

            try {
                for (const workout of pendingSync) {
                    await database.ref('workouts').push(workout);
                }
                
                // Clear pending sync
                pendingSync = [];
                localStorage.setItem('pendingSync', JSON.stringify(pendingSync));
                
                syncIndicator.textContent = '✓ Synchronisiert';
                setTimeout(() => {
                    syncIndicator.classList.remove('show');
                    syncIndicator.textContent = '🔄 Synchronisiere...';
                }, 2000);
                
                // Reload data
                loadWorkoutData();
            } catch (error) {
                console.error('Sync failed:', error);
                syncIndicator.textContent = '❌ Sync fehlgeschlagen';
                setTimeout(() => {
                    syncIndicator.classList.remove('show');
                    syncIndicator.textContent = '🔄 Synchronisiere...';
                }, 3000);
            }
        }

        // Save workout (online or offline)
        function saveWorkout(workout) {
            if (isOnline) {
                // Save directly to Firebase
                database.ref('workouts').push(workout).catch(error => {
                    console.error('Save failed, adding to pending sync:', error);
                    addToPendingSync(workout);
                });
            } else {
                // Save to pending sync
                addToPendingSync(workout);
            }
            
            // Update local data immediately
            const date = new Date(workout.timestamp);
            const dateStr = date.toISOString().split('T')[0];
            if (!workoutData[dateStr]) {
                workoutData[dateStr] = 0;
            }
            workoutData[dateStr]++;
        }

        function addToPendingSync(workout) {
            pendingSync.push(workout);
            localStorage.setItem('pendingSync', JSON.stringify(pendingSync));
            
            const indicator = document.getElementById('offlineIndicator');
            indicator.textContent = `📡 Offline (${pendingSync.length} ausstehend)`;
            indicator.classList.add('show');
        }

        // Check login
        const savedLogin = sessionStorage.getItem('workoutPlanLogin');
        if (savedLogin === 'true') {
            loadWorkoutData();
        }

        // Initial online status
        updateOnlineStatus();

        function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('authError');

            if (password === VALID_PASSWORD) {
                sessionStorage.setItem('workoutPlanLogin', 'true');
                errorDiv.classList.add('hidden');
                loadWorkoutData();
            } else {
                errorDiv.textContent = 'Falsches Passwort';
                errorDiv.classList.remove('hidden');
            }
        }

        // TEST: Add a workout for today
function addTestWorkout() {
    const today = new Date();
    today.setHours(0, 0, 0, 0); // Reset to midnight
    const dateStr = today.toISOString().split('T')[0];
    console.log('Adding workout for:', dateStr); // Debug
    workoutData[dateStr] = 2;
    localStorage.setItem('workoutData', JSON.stringify(workoutData));
    sessionStorage.setItem('workoutPlanLogin', 'true');
    showDaySelection();
}

        function loadWorkoutData() {
            if (isOnline) {
                database.ref('workouts').once('value', snapshot => {
                    const workouts = [];
                    snapshot.forEach(child => {
                        workouts.push(child.val());
                    });
                    
                    workoutData = {};
                    workouts.forEach(w => {
                        const date = new Date(w.timestamp);
                        const dateStr = date.toISOString().split('T')[0];
                        if (!workoutData[dateStr]) {
                            workoutData[dateStr] = 0;
                        }
                        workoutData[dateStr]++;
                    });

                    showDaySelection();
                }).catch(error => {
                    console.error('Failed to load from Firebase, using local data:', error);
                    loadLocalWorkoutData();
                });
            } else {
                loadLocalWorkoutData();
            }
        }

        function loadLocalWorkoutData() {
            const savedWorkoutData = localStorage.getItem('workoutData');
            if (savedWorkoutData) {
                try {
                    workoutData = JSON.parse(savedWorkoutData);
                } catch (e) {
                    console.error('Error loading local workout data:', e);
                }
            }
            showDaySelection();
        }

        function showDaySelection() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('dayScreen').classList.remove('hidden');
            document.getElementById('workoutScreen').classList.add('hidden');
            document.getElementById('editScreen').classList.add('hidden');

            renderHeatmap();
            renderDaySelector();
        }

function renderHeatmap() {
    const heatmap = document.getElementById('heatmap');
    const monthLabels = document.getElementById('monthLabels');
    heatmap.innerHTML = '';
    monthLabels.innerHTML = '';

    const today = new Date();
    const days = 364;
    const startDate = new Date(today);
    startDate.setDate(startDate.getDate() - days);

    const monthPositions = new Map();
    let lastMonth = '';

    for (let i = 0; i <= days; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);
        const dateStr = date.toISOString().split('T')[0];
        const count = workoutData[dateStr] || 0;

        const cell = document.createElement('div');
        cell.className = 'heatmap-cell';
        
        let level = 0;
        if (count > 0) level = 1;
        if (count >= 2) level = 2;
        if (count >= 4) level = 3;
        if (count >= 6) level = 4;
        
        cell.setAttribute('data-level', level);
        cell.title = `${dateStr}: ${count} ${count === 1 ? 'Übung' : 'Übungen'}`;
        
        heatmap.appendChild(cell);

        // Track month changes
        const month = date.toLocaleDateString('de-DE', { month: 'short' });
        const weekIndex = Math.floor(i / 7);
        
        if (month !== lastMonth) {
            lastMonth = month;
            monthPositions.set(weekIndex, month);
        }
    }

    // Create month labels with proper spacing
    const totalWeeks = Math.ceil((days + 1) / 7);
    
    for (let week = 0; week < totalWeeks; week++) {
        const label = document.createElement('div');
        label.textContent = monthPositions.get(week) || '';
        label.style.width = '15px';
        label.style.fontSize = '12px';
        label.style.color = '#666';
        monthLabels.appendChild(label);
    }
    
    // Set grid layout for month labels
    monthLabels.style.display = 'grid';
    monthLabels.style.gridTemplateColumns = `repeat(${totalWeeks}, 15px)`;
    monthLabels.style.gap = '3px';
    monthLabels.style.marginBottom = '5px';

    const totalDays = Object.keys(workoutData).length;
    document.getElementById('totalDays').textContent = totalDays;

    let currentStreak = 0;
    let checkDate = new Date(today);
    while (true) {
        const dateStr = checkDate.toISOString().split('T')[0];
        if (workoutData[dateStr]) {
            currentStreak++;
            checkDate.setDate(checkDate.getDate() - 1);
        } else {
            break;
        }
    }
    document.getElementById('currentStreak').textContent = currentStreak;

    let longestStreak = 0;
    let tempStreak = 0;
    for (let i = 0; i <= days; i++) {
        const date = new Date(startDate);
        date.setDate(date.getDate() + i);
        const dateStr = date.toISOString().split('T')[0];
        
        if (workoutData[dateStr]) {
            tempStreak++;
            longestStreak = Math.max(longestStreak, tempStreak);
        } else {
            tempStreak = 0;
        }
    }
    document.getElementById('longestStreak').textContent = longestStreak;
}

        function renderDaySelector() {
            const daySelector = document.getElementById('daySelector');
            daySelector.innerHTML = '';

            Object.keys(workoutPlan.schedule).forEach(day => {
                const workout = workoutPlan.schedule[day];
                const btn = document.createElement('div');
                btn.className = 'day-btn';
                btn.innerHTML = `<strong>${day}</strong><br><small>${workout.name}</small>`;
                btn.onclick = () => startWorkout(day);
                daySelector.appendChild(btn);
            });
        }

        function getExerciseLink(name) {
            const link = exerciseLinks[name];
            if (link) {
                return `<a href="${link}" target="_blank">${name}</a>`;
            }
            const searchQuery = encodeURIComponent(name + " tutorial");
            return `<a href="https://www.youtube.com/results?search_query=${searchQuery}" target="_blank">${name}</a>`;
        }

        function startWorkout(day) {
            currentDay = day;
            currentExerciseIndex = 0;
            completedExercises = [];

            document.getElementById('dayScreen').classList.add('hidden');
            document.getElementById('workoutScreen').classList.remove('hidden');
            document.getElementById('workoutTitle').textContent = workoutPlan.schedule[day].name;

            renderExerciseList();
            showCurrentExercise();
        }

        function renderExerciseList() {
            const exercises = workoutPlan.schedule[currentDay].exercises;
            const listDiv = document.getElementById('exerciseList');
            
            listDiv.innerHTML = exercises.map((ex, idx) => {
                let className = 'exercise-card';
                if (idx === currentExerciseIndex) className += ' current';
                if (completedExercises.includes(idx)) className += ' completed';

                return `
                    <div class="${className}">
                        <div class="exercise-name">${getExerciseLink(ex.name)}</div>
                        <div class="exercise-details">${ex.sets} Sätze × ${ex.reps} Wdh.</div>
                    </div>
                `;
            }).join('');

            updateProgress();
        }

        function updateProgress() {
            const exercises = workoutPlan.schedule[currentDay].exercises;
            const progress = (completedExercises.length / exercises.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showCurrentExercise() {
            const exercises = workoutPlan.schedule[currentDay].exercises;
            
            if (currentExerciseIndex >= exercises.length) {
                showComplete();
                return;
            }

            const exercise = exercises[currentExerciseIndex];

            document.getElementById('restTimer').classList.add('hidden');
            document.getElementById('exerciseCard').classList.remove('hidden');
            document.getElementById('completeCard').classList.add('hidden');

            document.getElementById('currentExerciseName').innerHTML = getExerciseLink(exercise.name);
            document.getElementById('currentExerciseDetails').textContent = 
                `${exercise.sets} Sätze × ${exercise.reps} Wiederholungen`;
            
            document.getElementById('logWeight').value = '';
            document.getElementById('logReps').value = '';
            
            renderExerciseList();
        }

        function nextExercise() {
            const weight = parseFloat(document.getElementById('logWeight').value);
            const reps = parseInt(document.getElementById('logReps').value);

            if (weight && reps) {
                const exercise = workoutPlan.schedule[currentDay].exercises[currentExerciseIndex];
                const workout = {
                    exercise: exercise.name,
                    weight: weight,
                    reps: reps,
                    sets: exercise.sets,
                    timestamp: Date.now()
                };

                saveWorkout(workout);
                localStorage.setItem('workoutData', JSON.stringify(workoutData));
            }

            completedExercises.push(currentExerciseIndex);
            currentExerciseIndex++;

            const exercises = workoutPlan.schedule[currentDay].exercises;
            if (currentExerciseIndex >= exercises.length) {
                showComplete();
            } else {
                startRestTimer();
            }
        }

        function skipExercise() {
            completedExercises.push(currentExerciseIndex);
            currentExerciseIndex++;

            const exercises = workoutPlan.schedule[currentDay].exercises;
            if (currentExerciseIndex >= exercises.length) {
                showComplete();
            } else {
                startRestTimer();
            }
        }

        function startRestTimer() {
            remainingSeconds = 120;
            
            document.getElementById('exerciseCard').classList.add('hidden');
            document.getElementById('restTimer').classList.remove('hidden');

            updateTimerDisplay();

            timerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();

                if (remainingSeconds <= 0) {
                    clearInterval(timerInterval);
                    showCurrentExercise();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            const display = `${minutes}:${seconds.toString().padStart(2, '0')}`;
            
            const timerEl = document.getElementById('timerDisplay');
            timerEl.textContent = display;

            timerEl.className = 'timer';
            if (remainingSeconds <= 10) {
                timerEl.classList.add('danger');
            } else if (remainingSeconds <= 30) {
                timerEl.classList.add('warning');
            }
        }

        function skipRest() {
            clearInterval(timerInterval);
            showCurrentExercise();
        }

        function showComplete() {
            clearInterval(timerInterval);
            
            document.getElementById('exerciseCard').classList.add('hidden');
            document.getElementById('restTimer').classList.add('hidden');
            document.getElementById('completeCard').classList.remove('hidden');
        }

        function endWorkout() {
            clearInterval(timerInterval);
            backToDaySelection();
        }

        function backToDaySelection() {
            clearInterval(timerInterval);
            currentDay = null;
            currentExerciseIndex = 0;
            completedExercises = [];
            loadWorkoutData();
        }

        function showEditPlan() {
            document.getElementById('dayScreen').classList.add('hidden');
            document.getElementById('editScreen').classList.remove('hidden');
            renderEditForm();
        }

        function renderEditForm() {
            const editContent = document.getElementById('editContent');
            let html = '';

            Object.keys(workoutPlan.schedule).forEach(day => {
                const workout = workoutPlan.schedule[day];
                html += `
                    <div class="edit-day-card">
                        <h3>${day}</h3>
                        <div>
                            <label class="label">Workout Name</label>
                            <input type="text" class="workout-name" data-day="${day}" value="${workout.name}">
                        </div>
                        <div style="margin-top: 15px;">
                            <label class="label">Übungen</label>
                            <div class="exercises-list" data-day="${day}">
                                ${workout.exercises.map((ex, idx) => `
                                    <div class="edit-exercise-item">
                                        <div class="input-grid">
                                            <input type="text" class="ex-name" placeholder="Übungsname" value="${ex.name}">
                                            <input type="number" class="ex-sets" placeholder="Sätze" value="${ex.sets}">
                                            <input type="text" class="ex-reps" placeholder="Wdh." value="${ex.reps}">
                                        </div>
                                        <button class="small danger" onclick="removeExercise('${day}', ${idx})">🗑️ Löschen</button>
                                    </div>
                                `).join('')}
                            </div>
                            <button class="small" onclick="addExercise('${day}')">➕ Übung hinzufügen</button>
                        </div>
                    </div>
                `;
            });

            editContent.innerHTML = html;
        }

        function addExercise(day) {
            const container = document.querySelector(`.exercises-list[data-day="${day}"]`);
            const newExercise = document.createElement('div');
            newExercise.className = 'edit-exercise-item';
            newExercise.innerHTML = `
                <div class="input-grid">
                    <input type="text" class="ex-name" placeholder="Übungsname" value="">
                    <input type="number" class="ex-sets" placeholder="Sätze" value="3">
                    <input type="text" class="ex-reps" placeholder="Wdh." value="10-12">
                </div>
                <button class="small danger" onclick="this.parentElement.remove()">🗑️ Löschen</button>
            `;
            container.appendChild(newExercise);
        }

        function removeExercise(day, idx) {
            renderEditForm();
        }

        function savePlanEdits() {
            const errorDiv = document.getElementById('editError');
            const successDiv = document.getElementById('editSuccess');
            
            try {
                const newSchedule = {};

                Object.keys(workoutPlan.schedule).forEach(day => {
                    const nameInput = document.querySelector(`.workout-name[data-day="${day}"]`);
                    const exercisesList = document.querySelector(`.exercises-list[data-day="${day}"]`);
                    const exerciseItems = exercisesList.querySelectorAll('.edit-exercise-item');

                    const exercises = [];
                    exerciseItems.forEach(item => {
                        const name = item.querySelector('.ex-name').value.trim();
                        const sets = parseInt(item.querySelector('.ex-sets').value);
                        const reps = item.querySelector('.ex-reps').value.trim();

                        if (name && sets && reps) {
                            exercises.push({ name, sets, reps });
                        }
                    });

                    newSchedule[day] = {
                        name: nameInput.value,
                        workout_type: workoutPlan.schedule[day].workout_type,
                        exercises: exercises
                    };
                });

                workoutPlan.schedule = newSchedule;
                localStorage.setItem('workoutPlan', JSON.stringify(workoutPlan));
                
                errorDiv.classList.add('hidden');
                successDiv.textContent = '✓ Plan gespeichert!';
                successDiv.classList.remove('hidden');

                setTimeout(() => {
                    backToDaySelection();
                }, 1500);

            } catch (e) {
                errorDiv.textContent = 'Fehler beim Speichern: ' + e.message;
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }
        }

        window.addEventListener('load', () => {
            const passwordInput = document.getElementById('password');
            if (passwordInput && !document.getElementById('authScreen').classList.contains('hidden')) {
                passwordInput.focus();
            }
        });
    </script>
