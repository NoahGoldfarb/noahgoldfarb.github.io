<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spy Online</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5272865915730434"
     crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }

        .hidden {
            display: none;
        }

        button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
        }
    </style>
</head>
<body onload="toggleManualInput()">
    <div id="setup">
        <h2>Spion Settings</h2>
        <label>Number Players:</label>
        <input type="number" id="playerCount" min="3" max="20" value="4"><br><br>

        <label>Number Spy's:</label>
        <input type="number" id="spyCount" min="1" max="20" value="1"><br><br>

        <label>Category:</label>
        <select id="category" onchange="toggleManualInput()">
            <option value="Standorte">Standorte</option>
            <option value="Objekte">Objekte</option>
            <option value="Natur">Natur</option>
            <option value="Tiere">Tiere</option>
            <option value="Manuell">Manuelle Eingabe</option>
        </select><br><br>

        <div id="manualInput" class="hidden">
            <label>Main Word:</label>
            <input type="text" id="mainWord"><br><br>
            <label>Spy Word:</label>
            <input type="text" id="spyWord" placeholder="(optional, default: 'spy')"><br><br>
        </div>

        <div id="spyOption" class="hidden">
            <label>Choose Spyword:</label><br>
            <input type="radio" name="spyWordChoice" value="random" checked> Zufälliges anderes Wort<br>
            <input type="radio" name="spyWordChoice" value="spy"> "spy" verwenden<br><br>
        </div>

        <button onclick="startGame()">Spiel starten</button>
    </div>

    <div id="game" class="hidden">
        <h2>Pass on the phone</h2>
        <button onclick="showWord()">Tap to Reveal</button>
        <h3 id="wordDisplay" class="hidden"></h3>
        <button id="nextPlayer" onclick="nextPlayer()" class="hidden">Nächster Spieler</button>
    </div>

    <script>
        const categories = {
            "Standorte": ["Haus", "Wohnung", "Garten", "Balkon", "Dachboden", "Keller", "Garage", "Schule", "Universität", "Büro"],
            "Objekte": ["Tisch", "Stuhl", "Bett", "Lampe", "Schrank"],
            "Natur": ["Baum", "Blume", "Strauch", "Gras", "Moos"],
            "Tiere": ["Löwe", "Tiger", "Elefant", "Giraffe", "Nashorn"]
        };

        let players = [];
        let assignedWords = [];
        let currentIndex = 0;

        function toggleManualInput() {
            const category = document.getElementById("category").value;
            document.getElementById("manualInput").classList.toggle("hidden", category !== "Manuell");
            document.getElementById("spyOption").classList.toggle("hidden", category === "Manuell");
        }

        function startGame() {
            const playerCount = parseInt(document.getElementById("playerCount").value);
            const spyCount = parseInt(document.getElementById("spyCount").value);
            const category = document.getElementById("category").value;

            if (spyCount >= playerCount) {
                alert("Spione müssen weniger als Spieler sein!");
                return;
            }

            players = Array.from({ length: playerCount }, (_, i) => `Spieler ${i + 1}`);

            let mainWord, spyWord;

            if (category === "Manuell") {
                mainWord = document.getElementById("mainWord").value.trim();
                spyWord = document.getElementById("spyWord").value.trim();

                if (!mainWord) {
                    alert("Bitte ein Hauptwort eingeben!");
                    return;
                }

                if (!spyWord) {
                    spyWord = "spy";
                }
            } else {
                const words = categories[category];
                mainWord = words[Math.floor(Math.random() * words.length)];

                const spyChoice = document.querySelector('input[name="spyWordChoice"]:checked').value;
                if (spyChoice === "spy") {
                    spyWord = "spy";
                } else {
                    do {
                        spyWord = words[Math.floor(Math.random() * words.length)];
                    } while (spyWord === mainWord);
                }
            }

            assignedWords = Array(playerCount).fill(mainWord);
            for (let i = 0; i < spyCount; i++) {
                let index;
                do {
                    index = Math.floor(Math.random() * playerCount);
                } while (assignedWords[index] !== mainWord);
                assignedWords[index] = spyWord;
            }

            document.getElementById("setup").classList.add("hidden");
            document.getElementById("game").classList.remove("hidden");

            currentIndex = 0;
            document.getElementById("wordDisplay").classList.add("hidden");
            document.getElementById("nextPlayer").classList.add("hidden");
        }

        function showWord() {
            document.getElementById("wordDisplay").innerText = assignedWords[currentIndex];
            document.getElementById("wordDisplay").classList.remove("hidden");
            document.getElementById("nextPlayer").classList.remove("hidden");
        }

        function nextPlayer() {
            currentIndex++;
            if (currentIndex >= players.length) {
                alert("Alle Spieler haben ihre Wörter gesehen!");
                location.reload();
            } else {
                document.getElementById("wordDisplay").classList.add("hidden");
                document.getElementById("nextPlayer").classList.add("hidden");
            }
        }
    </script>
</body>
</html>
