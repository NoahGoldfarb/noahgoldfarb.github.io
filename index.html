<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 1rem;
        }

        input, select {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 18px;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: linear-gradient(135deg, #95a5a6 0%, #7f8c8d 100%);
        }

        .hidden {
            display: none;
        }

        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.95rem;
            padding: 12px;
            background: #fee;
            border-radius: 10px;
            text-align: center;
        }

        .success {
            color: #27ae60;
            margin-top: 15px;
            font-size: 0.95rem;
            padding: 12px;
            background: #efe;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.95;
        }

        .workout-entry {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .workout-date {
            color: #666;
            font-size: 0.85rem;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .workout-details {
            color: #333;
            font-weight: 600;
            font-size: 1.05rem;
        }

        .exercise-name {
            color: #667eea;
            font-weight: 700;
        }

        .chart-container {
            margin-top: 20px;
            height: 300px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
        }

        #exerciseList {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .pr-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 8px;
        }

        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .add-new-option {
            color: #667eea;
            font-weight: 600;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px;
            }

            h1 {
                font-size: 2rem;
            }

            .input-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .stat-value {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="authScreen" class="card">
            <h1>💪 Workout Tracker</h1>
            <div class="input-group">
                <label for="password">Passwort</label>
                <input type="password" id="password" placeholder="Passwort eingeben" onkeypress="if(event.key==='Enter')login()">
            </div>
            <button onclick="login()">Anmelden</button>
            <div id="authError" class="error"></div>
        </div>

        <!-- Main Entry Screen -->
        <div id="entryScreen" class="hidden card">
            <h1>💪 Workout Tracker</h1>
            
            <div class="input-group">
                <label for="exerciseSelect">Übung</label>
                <select id="exerciseSelect" onchange="handleExerciseChange()">
                    <option value="">Übung auswählen...</option>
                    <option value="__new__" class="add-new-option">➕ Neue Übung hinzufügen</option>
                </select>
            </div>

            <div id="newExerciseGroup" class="input-group hidden">
                <label for="newExercise">Neue Übung</label>
                <input type="text" id="newExercise" placeholder="z.B. Bankdrücken">
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label for="weight">Gewicht (kg)</label>
                    <input type="number" id="weight" placeholder="60" step="0.5">
                </div>
                <div class="input-group">
                    <label for="reps">Wdh.</label>
                    <input type="number" id="reps" placeholder="10">
                </div>
                <div class="input-group">
                    <label for="sets">Sätze</label>
                    <input type="number" id="sets" placeholder="3">
                </div>
            </div>

            <button onclick="addWorkout()">➕ Hinzufügen</button>
            <button onclick="showProgress()" class="secondary">📊 Fortschritt anzeigen</button>
            
            <div id="addError" class="error"></div>
            <div id="addSuccess" class="success"></div>
        </div>

        <!-- Progress Screen -->
        <div id="progressScreen" class="hidden card">
            <h1>📊 Dein Fortschritt</h1>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalWorkouts">0</div>
                    <div class="stat-label">Workouts</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalExercises">0</div>
                    <div class="stat-label">Übungen</div>
                </div>
            </div>

            <div class="input-group">
                <label for="filterExercise">Übung filtern</label>
                <select id="filterExercise" onchange="filterWorkouts()">
                    <option value="">Alle Übungen</option>
                </select>
            </div>

            <div class="chart-container">
                <canvas id="progressChart"></canvas>
            </div>

            <div id="exerciseList"></div>

            <button onclick="backToEntry()">⬅️ Zurück</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBYjVqcev5mhR7pZ0xo5wTeSZDre8teK7Y",
            authDomain: "workouttracker-d2874.firebaseapp.com",
            databaseURL: "https://workouttracker-d2874-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "workouttracker-d2874",
            storageBucket: "workouttracker-d2874.firebasestorage.app",
            messagingSenderId: "1083877654863",
            appId: "1:1083877654863:web:bd26ae58b900c8d93b853a",
            measurementId: "G-9X2QJFW701"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const VALID_PASSWORD = "123456";
        let workouts = [];
        let chart = null;

        // Check if already logged in
        const savedLogin = sessionStorage.getItem('workoutTrackerLogin');
        if (savedLogin === 'true') {
            showEntry();
            loadWorkouts();
        }

        function showAuth() {
            document.getElementById('authScreen').classList.remove('hidden');
            document.getElementById('entryScreen').classList.add('hidden');
            document.getElementById('progressScreen').classList.add('hidden');
        }

        function showEntry() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('entryScreen').classList.remove('hidden');
            document.getElementById('progressScreen').classList.add('hidden');
        }

        function showProgress() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('entryScreen').classList.add('hidden');
            document.getElementById('progressScreen').classList.remove('hidden');
            updateStats();
            updateProgressFilter();
            filterWorkouts();
            updateChart();
        }

        function backToEntry() {
            showEntry();
        }

        function login() {
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('authError');

            if (password === VALID_PASSWORD) {
                sessionStorage.setItem('workoutTrackerLogin', 'true');
                errorDiv.textContent = '';
                showEntry();
                loadWorkouts();
            } else {
                errorDiv.textContent = 'Falsches Passwort';
            }
        }

        function handleExerciseChange() {
            const select = document.getElementById('exerciseSelect');
            const newExerciseGroup = document.getElementById('newExerciseGroup');
            
            if (select.value === '__new__') {
                newExerciseGroup.classList.remove('hidden');
                document.getElementById('newExercise').focus();
            } else {
                newExerciseGroup.classList.add('hidden');
                if (select.value) {
                    document.getElementById('weight').focus();
                }
            }
        }

        async function addWorkout() {
            const exerciseSelect = document.getElementById('exerciseSelect');
            const newExerciseInput = document.getElementById('newExercise');
            
            let exercise = '';
            if (exerciseSelect.value === '__new__') {
                exercise = newExerciseInput.value.trim();
            } else {
                exercise = exerciseSelect.value;
            }

            const weight = parseFloat(document.getElementById('weight').value);
            const reps = parseInt(document.getElementById('reps').value);
            const sets = parseInt(document.getElementById('sets').value);
            const errorDiv = document.getElementById('addError');
            const successDiv = document.getElementById('addSuccess');

            if (!exercise || !weight || !reps || !sets) {
                errorDiv.textContent = 'Bitte alle Felder ausfüllen';
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
                return;
            }

            const workout = {
                exercise,
                weight,
                reps,
                sets,
                timestamp: Date.now()
            };

            try {
                await database.ref('workouts').push(workout);
                errorDiv.classList.add('hidden');
                successDiv.textContent = '✓ Workout hinzugefügt!';
                successDiv.classList.remove('hidden');
                
                // Clear inputs
                document.getElementById('weight').value = '';
                document.getElementById('reps').value = '';
                document.getElementById('sets').value = '';
                document.getElementById('newExercise').value = '';
                document.getElementById('newExerciseGroup').classList.add('hidden');
                
                // Keep the same exercise selected
                if (exerciseSelect.value === '__new__') {
                    exerciseSelect.value = '';
                }
                
                document.getElementById('exerciseSelect').focus();

                setTimeout(() => successDiv.classList.add('hidden'), 2000);
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                successDiv.classList.add('hidden');
            }
        }

        function loadWorkouts() {
            database.ref('workouts').on('value', snapshot => {
                workouts = [];
                snapshot.forEach(child => {
                    workouts.push({
                        id: child.key,
                        ...child.val()
                    });
                });
                workouts.sort((a, b) => b.timestamp - a.timestamp);
                updateExerciseSelect();
            });
        }

        function updateExerciseSelect() {
            const exercises = [...new Set(workouts.map(w => w.exercise))].sort();
            const select = document.getElementById('exerciseSelect');
            const currentValue = select.value;
            
            // Keep first option and "new" option
            select.innerHTML = '<option value="">Übung auswählen...</option>';
            
            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                select.appendChild(option);
            });
            
            // Add "new" option at the end
            const newOption = document.createElement('option');
            newOption.value = '__new__';
            newOption.className = 'add-new-option';
            newOption.textContent = '➕ Neue Übung hinzufügen';
            select.appendChild(newOption);
            
            if (currentValue && currentValue !== '__new__') {
                select.value = currentValue;
            }
        }

        function updateStats() {
            const totalWorkouts = workouts.length;
            const uniqueExercises = new Set(workouts.map(w => w.exercise)).size;
            
            document.getElementById('totalWorkouts').textContent = totalWorkouts;
            document.getElementById('totalExercises').textContent = uniqueExercises;
        }

        function updateProgressFilter() {
            const exercises = [...new Set(workouts.map(w => w.exercise))].sort();
            const select = document.getElementById('filterExercise');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">Alle Übungen</option>';
            exercises.forEach(ex => {
                const option = document.createElement('option');
                option.value = ex;
                option.textContent = ex;
                select.appendChild(option);
            });
            
            select.value = currentValue;
        }

        function filterWorkouts() {
            displayWorkouts();
            updateChart();
        }

        function displayWorkouts() {
            const filter = document.getElementById('filterExercise').value;
            const filtered = filter ? workouts.filter(w => w.exercise === filter) : workouts;
            const container = document.getElementById('exerciseList');

            if (filtered.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">Keine Workouts vorhanden</p>';
                return;
            }

            // Calculate PRs
            const prMap = {};
            workouts.forEach(w => {
                if (!prMap[w.exercise] || w.weight > prMap[w.exercise]) {
                    prMap[w.exercise] = w.weight;
                }
            });

            container.innerHTML = filtered.slice(0, 10).map(workout => {
                const isPR = workout.weight === prMap[workout.exercise];
                
                return `
                    <div class="workout-entry">
                        <div class="workout-date">${new Date(workout.timestamp).toLocaleDateString('de-DE', { 
                            day: '2-digit', 
                            month: '2-digit',
                            year: '2-digit'
                        })}</div>
                        <div class="workout-details">
                            <span class="exercise-name">${workout.exercise}</span>: 
                            ${workout.weight} kg × ${workout.reps} × ${workout.sets}
                            ${isPR ? '<span class="pr-badge">PR 🏆</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateChart() {
            const filter = document.getElementById('filterExercise').value;
            const filtered = filter ? workouts.filter(w => w.exercise === filter) : workouts;
            const sorted = [...filtered].sort((a, b) => a.timestamp - b.timestamp);

            const ctx = document.getElementById('progressChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            if (sorted.length === 0) {
                ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
                ctx.font = '16px Arial';
                ctx.fillStyle = '#999';
                ctx.textAlign = 'center';
                ctx.fillText('Keine Daten', ctx.canvas.width / 2, ctx.canvas.height / 2);
                return;
            }

            const datasets = {};
            const colors = ['#667eea', '#764ba2', '#f093fb', '#4facfe', '#43e97b', '#fa709a'];
            let colorIndex = 0;

            sorted.forEach(w => {
                if (!datasets[w.exercise]) {
                    datasets[w.exercise] = {
                        label: w.exercise,
                        data: [],
                        borderColor: colors[colorIndex % colors.length],
                        backgroundColor: colors[colorIndex % colors.length] + '20',
                        tension: 0.4,
                        borderWidth: 3,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    };
                    colorIndex++;
                }
                datasets[w.exercise].data.push({
                    x: new Date(w.timestamp),
                    y: w.weight
                });
            });

            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    datasets: Object.values(datasets)
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top'
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            time: {
                                unit: 'day'
                            },
                            title: {
                                display: true,
                                text: 'Datum'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Gewicht (kg)'
                            },
                            beginAtZero: false
                        }
                    }
                }
            });
        }

        // Auto-focus
        window.addEventListener('load', () => {
            const passwordInput = document.getElementById('password');
            if (passwordInput && !passwordInput.classList.contains('hidden')) {
                passwordInput.focus();
            }
        });
    </script>
</body>
</html>
